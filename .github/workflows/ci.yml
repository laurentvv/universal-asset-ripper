name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  rust:
    name: treesize-clone / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: examples/treesize-clone
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/treesize-clone
      # Windows is the primary target; some Windows-only code is dead on Linux, so lint there only.
      - run: cargo clippy --all-targets -- -D warnings
        if: runner.os == 'Windows'
      - run: cargo test
      - name: Build release binary
        if: runner.os == 'Windows'
        run: cargo build --release
      - name: Upload treesize-clone.exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: treesize-clone-windows-x64
          path: examples/treesize-clone/target/release/treesize-clone.exe
          if-no-files-found: error
