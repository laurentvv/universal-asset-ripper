[package]
name = "bvrs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
rpassword = "7.5.4"
russh = { version = "0.63.3", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
tokio = { version = "1.54.0", features = ["full"] }

[dev-dependencies]
rand = "0.10.3"
tempfile = "3.27.0"
